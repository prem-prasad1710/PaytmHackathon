services:
  - type: web
    name: scam-shield-ml
    runtime: python
    rootDir: ml
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python text_model/train.py &&
      python -m dataset.generate_dataset &&
      python -m training.train_model
    startCommand: uvicorn inference.model_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: scam-shield-api
    runtime: node
    plan: free
    buildCommand: npm --prefix server install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ML_SERVICE_ENABLED
        value: "true"
      - key: ML_SERVICE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ALLOW_INSECURE_TLS
        value: "false"
      - key: LLM_PROVIDER
        value: none
      - key: GROQ_API_KEY
        sync: false
